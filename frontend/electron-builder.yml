# ECHO OS — Electron Builder Configuration
appId: com.echo-os.desktop
productName: ECHO OS
copyright: Copyright © 2024 ECHO OS

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/favicon.svg

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerHeaderIcon: public/favicon.svg

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/favicon.svg

linux:
  target:
    - AppImage
    - deb
  icon: public/favicon.svg
  category: Utility

publish: null
